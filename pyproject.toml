[project]
name = "pytest-tutorial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aleksander Kolodziejczyk", email = "olekk31@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "coverage>=7.14.0",
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "requests>=2.34.2",
    "ruff>=0.15.13",
]

[project.scripts]
pytest-tutorial = "pytest_tutorial:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.14.0",
]

[tool.pytest.ini_options]
addopts = "--maxfail=1"
